  actions: []

- version: "0.13.3"
  date: 2026-10-01
  data_version: 4
  notes:
    ru:
      - "Треки подготовки: теория, задачи, system design, софт-скиллы и слова — у каждого своё кольцо на сегодня, неделя, норма в день и прогноз. Вверху плана — дата готовности по самому медленному треку вместо общего процента; тренажёр слов ниже. Клик по треку показывает только его темы."
    en:
      - "Study tracks: theory, coding problems, system design, soft skills and words — each with its own ring for today, the week, a daily goal and a forecast. The top of the plan shows the readiness date of the slowest track instead of an overall percent; the word trainer sits below. Clicking a track shows only its topics."
  actions: [rebuild_page]

- version: "0.13.2"
  date: 2026-10-01
  data_version: 4
  notes:
    ru:
      - "Дневная норма новых слов (по умолчанию 20, меняется ползунком): кольцо на сегодня, семь колец за неделю и серия дней с выполненной нормой. «Учить по важности» берёт не больше нормы новых слов в день, прогноз считается по норме."
    en:
      - "Daily goal of new words (20 by default, adjustable with a slider): a ring for today, seven rings for the week and a streak of days with the goal met. \"Learn by importance\" takes no more new words a day than the goal, and the forecast uses the goal."
  actions: [rebuild_page]

- version: "0.13.1"
  date: 2026-10-01
  data_version: 4
  notes:
    ru:
      - "Тренажёр: общий прогресс и прогресс каждой колоды в процентах, темп (новых слов в день) и прогноз — через сколько дней начнёте и к какой дате выучите каждую колоду и все слова."
      - "Исправлен прогноз «сколько дней осталось»: отметки без даты или с датой в другом формате больше не превращают его в тысячи дней."
    en:
      - "Trainer: overall and per-deck progress in percent, pace (new words a day) and a forecast — in how many days you start and by which date you learn each deck and all words."
      - "Fixed the \"days left\" forecast: marks without a date or with a date in another format no longer turn it into thousands of days."
  actions: [rebuild_page]

- version: "0.13.0"
  date: 2026-10-01
  data_version: 4
  notes:
    ru:
      - "Языки курса: при старте можно отметить один или несколько. Материалы пишутся только на выбранных — один язык, значит без дублей и лишнего расхода токенов."
      - "Переключатель языка на странице показывает только выбранные языки; при одном языке его нет."
      - "Исправлено: разделы плана снова раскрываются (в том числе в Safari), а старая вкладка больше не может затереть прогресс."
      - "Вкладка «Собесы»: каждая компания — своя сворачиваемая карточка с картой этапов (пройден, провален, назначен, впереди), прогресс-баром и итогом — в процессе, успех или неудача."
      - "В открытом материале — кнопка «Скопировать»: тема, описание и весь урок одним текстом, чтобы вставить в новый чат и разобрать."
      - "Задачи по system design — теперь план разговора, а не готовое решение: функциональные и нефункциональные требования, что уточнить у интервьюера, на что обратить внимание при реализации. Старые задачи кнопка «Углубить материалы» перепишет в новом формате."
    en:
      - "Course languages: pick one or several at the start. Materials are written only in the chosen ones — one language means no duplicates and no wasted tokens."
      - "The page language switcher shows only the chosen languages; with one language there is none."
      - "Fixed: plan sections expand again (Safari included), and an old tab can no longer overwrite your progress."
      - "Interviews tab: each company is its own collapsible card with a stage map (passed, failed, scheduled, ahead), a progress bar and the outcome — in progress, success or failure."
      - "An open lesson has a Copy button: the topic, its summary and the whole lesson as one text, ready to paste into a new chat."
      - "System design problems are now a plan for the conversation, not a worked solution: functional and non-functional requirements, what to ask the interviewer, what to watch for in the implementation. \"Deepen materials\" rewrites old ones in the new format."
  actions: [rebuild_page]

