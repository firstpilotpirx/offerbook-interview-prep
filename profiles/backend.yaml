  - id: clean-architecture
    title: "Robert Martin — The Clean Architecture"
    url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
    covers: ["theory.code.clean-arch", "theory.code.solid"]
